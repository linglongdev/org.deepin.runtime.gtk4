version: "1"

package:
  id: org.deepin.runtime.gtk4
  name: Linyaps GTK4 Runtime
  kind: runtime
  version: 25.2.2.1
  description: |
    GTK4 is a cross-platform C application framework. GTK's primary feature
    is its rich set of widgets that provide standard and beautiful GUI functionality.

base: org.deepin.base/25.2.2

buildext:
  apt:
    build_depends:
      - git
      - quilt
      - devscripts
      - equivs
      - build-essential
      - fakeroot
      - bubblewrap
      - xdg-dbus-proxy
      - libseccomp-dev
      - clang
      - cmake                 # >= 3.20
      - flite1-dev
      - libglib2.0-dev
      - libharfbuzz-dev
      - libcairo2-dev
      - libdrm-dev
      - libfontconfig-dev
      - libfreetype-dev
      - libicu-dev
      - libgcrypt20-dev
      - libhyphen-dev
      - libjxl-dev
      - liblcms2-dev
      - libmanette-0.2-dev
      - libsysprof-capture-4-dev  # >= 3.38.0
      - libxslt1-dev
      - libxml2-dev
      - libsoup-3.0-dev
      - libgtk-3-dev
      - libgtk-4-dev
      - libsqlite3-dev
      - libsystemd-dev
      - libgudev-1.0-dev
      - libwoff-dev
      - gperf
      - bison
      - flex
      - ruby                 # ruby:native
      - unifdef
      - libavif-dev
      - libjpeg-dev
      - libopenjp2-7-dev
      - libpng-dev
      - libtasn1-6-dev
      - libwebp-dev
      - libxt-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer-plugins-bad1.0-dev
      - libenchant-2-dev
      - libsecret-1-dev
      - gobject-introspection
      - libgirepository1.0-dev
      - ninja-build
      - libegl-dev
      - libgl-dev
      - libgles-dev
      - gi-docgen
      - jdupes

build: |
  mkdir -p /project/webkit2gtk4
  mv /project/linglong/sources/webkit2gtk /project/webkit2gtk4/webkit2gtk
  cd /project/webkit2gtk4/webkit2gtk
  export QUILT_PATCHES=debian/patches
  quilt import /project/0001-fix-runtime-adapt-to-Linglong-runtime-path.patch || true
  # quilt push -a || true
  dpkg-buildpackage -uc -us -nc -b || (echo "首次失败，5 秒后重试…" >&2; sleep 5; dpkg-buildpackage -uc -us -nc -b)
  cp -a ../libjavascriptcoregtk-4.1-0_2.48.0-1deepin1_arm64.deb /project/linglong/sources/ || true
  cp -a ../libjavascriptcoregtk-4.1-dev_2.48.0-1deepin1_arm64.deb /project/linglong/sources/ || true
  cp -a ../libwebkit2gtk-4.1-0_2.48.0-1deepin1_arm64.deb /project/linglong/sources/ || true
  cp -a ../libwebkit2gtk-4.1-dev_2.48.0-1deepin1_arm64.deb /project/linglong/sources/ || true
  cd /project
  bash ./build.bash
sources:
  - kind: git
    url: https://github.com/deepin-community/webkit2gtk.git
    commit: dcbot/debian/2.50.4
    version: dcbot/debian/2.50.4
    name: webkit2gtk
