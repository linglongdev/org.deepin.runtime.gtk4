version: "1"

package:
  id: org.deepin.runtime.gtk4
  name: Linyaps GTK4 Runtime
  kind: runtime
  version: 25.2.2.1
  description: |
    GTK4 is a cross-platform C application framework. GTK's primary feature
    is its rich set of widgets that provide standard and beautiful GUI functionality.

base: org.deepin.base/25.2.2

buildext:
  apt:
    build_depends:
      # 打包工具（quilt 用来导入本仓库的三个补丁；debhelper/dpkg-dev 满足
      # control 里的 debhelper-compat 并支撑 dpkg-buildpackage；fakeroot 给 binary 阶段用）
      - quilt
      - build-essential
      - fakeroot
      - debhelper
      - dpkg-dev
      # 编译与链接工具
      - ccache
      - clang-16
      - cmake
      - ninja-build
      - gperf
      - bison
      - flex
      - ruby
      - unifdef
      # 上游 debian/control 声明的 Build-Depends（单变体只需 libsoup-3.0-dev + libgtk-3-dev）
      - bubblewrap
      - xdg-dbus-proxy
      - libseccomp-dev
      - flite1-dev
      - libglib2.0-dev
      - libharfbuzz-dev
      - libcairo2-dev
      - libdrm-dev
      - libfontconfig-dev
      - libfreetype-dev
      - libicu-dev
      - libgcrypt20-dev
      - libhyphen-dev
      - liblcms2-dev
      - libmanette-0.2-dev
      - libxslt1-dev
      - libxml2-dev
      - libsoup-3.0-dev
      - libgtk-3-dev
      - libsqlite3-dev
      - libsystemd-dev
      - libgudev-1.0-dev
      - libwoff-dev
      - libavif-dev
      - libjpeg-dev
      - libopenjp2-7-dev
      - libpng-dev
      - libtasn1-6-dev
      - libwebp-dev
      - libxt-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libenchant-2-dev
      - libsecret-1-dev
      - gobject-introspection
      - libegl-dev
      - libgl-dev
      - libgles-dev
      # 另外两个：g-ir-scanner 需要 gobject-introspection-1.0.pc；plugins-bad 提供
      # gstreamer-codecparsers/mpegts/webrtc 的 .pc（上游 Build-Depends 没写，删了 configure 会缺模块）
      - libgirepository1.0-dev
      - libgstreamer-plugins-bad1.0-dev
      # runtime 需要的包（清单见 runtime-packages.list，build.bash 会把它们的文件
      # 从构建容器拷进 /runtime；apt 会连带装上它们的依赖）
      - libgtk-4-1
      - libgtk-4-common
      - libgtk-4-dev
      - libgtk-4-media-gstreamer
      - libgtk-3-0
      - libgtk-3-bin
      - libgtk-3-common
      - libadwaita-1-0
      - libadwaita-1-dev
      - libavif16
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good

build: |
  set -e
  # 优化点 1: 运行时只需要 webkit2gtk-4.1（soup3/GTK3）这一套包。上游
  # debian/rules 默认编译 soup2/GTK3、soup3/GTK3、soup3/GTK4 三个变体，
  # 编译时间是单变体的约三倍；0002 补丁只保留需要的那一个变体。
  cd /project/linglong/sources/webkit2gtk
  export QUILT_PATCHES=debian/patches
  for patch in /project/*.patch; do
    quilt import "$patch" || true
  done
  # 断言补丁确实导入到 series：quilt import 的失败会被上面的 || true 吞掉，
  # 那样会静默退化成"三变体"构建（更慢但也能成功），很难发现。
  for p in 0001-fix-runtime-adapt-to-Linglong-runtime-path \
           0002-build-only-webkit2gtk-4.1-soup3-flavour \
           0003-ccache-dir-outside-build-tree \
           0004-build-depends-single-flavour; do
    grep -q "^${p}.patch$" debian/patches/series || {
      echo "错误: 补丁 ${p} 未导入 debian/patches/series" >&2
      exit 1
    }
  done
  # 优化点 2: 并行构建 + 跳过测试、文档与 dbgsym 打包，缩短编译/打包时间。
  # webkit2gtk 的 unified build 单个编译单元的内存峰值可达数 GB，核多不代表能开满：
  # 按"每个并行任务预留 4 GB"估算并行度，再受 nproc 限制（16 核 / 31 GB → 7），
  # 否则 -j16 会把内存吃光、把整机拖到 swap 抖动。
  mem_gb=$(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1048576 ))
  jobs=$(( mem_gb / 4 ))
  if [ "$jobs" -gt "$(nproc)" ]; then jobs=$(nproc); fi
  if [ "$jobs" -lt 2 ]; then jobs=2; fi
  export DEB_BUILD_OPTIONS="parallel=$jobs nocheck nodoc noautodbgsym terse"
  # 优化点 3: ccache。ll-builder 每次构建都会从 fetch cache 重新展开源码树，
  # debian/rules 默认把缓存放在 $(CURDIR)/ccache（在源码树里，会跟着一起被删，
  # 实测 0 命中）；0003 补丁让它支持外部指定，这里放到 /project 下的 linglong/
  # （= 宿主仓库目录，跨构建保留；linglong/ 已在 .gitignore 里）。
  export CCACHE_DIR=/project/linglong/ccache
  ccache --max-size=5G >/dev/null 2>&1 || true
  echo "[build] 并行编译任务数: $jobs (nproc=$(nproc), 内存 ${mem_gb}G), ccache 目录: $CCACHE_DIR"
  echo "[build] ccache 构建前: $(ccache -s 2>/dev/null | tr -s ' \n' ' ' | cut -c1-150)"
  echo "[build] webkit2gtk 编译开始: $(date '+%F %T')"
  dpkg-buildpackage -us -uc -nc -b || (echo "首次失败，5 秒后重试…" >&2; sleep 5; dpkg-buildpackage -us -uc -nc -b)
  echo "[build] webkit2gtk 编译结束: $(date '+%F %T')"
  echo "[build] ccache 构建后: $(ccache -s 2>/dev/null | tr -s ' \n' ' ' | cut -c1-150)"
  # dpkg-buildpackage 会把 deb 输出到源码目录的父目录，也就是
  # /project/linglong/sources；build.bash 直接从这些 deb 里取本仓库编译的包。
  # 这里显式检查产物是否存在，避免旧脚本写死 2.48.0 版本号导致的静默失败。
  ls -1 ../libjavascriptcoregtk-4.1-0_*.deb \
        ../libjavascriptcoregtk-4.1-dev_*.deb \
        ../libwebkit2gtk-4.1-0_*.deb \
        ../libwebkit2gtk-4.1-dev_*.deb \
        ../gir1.2-javascriptcoregtk-4.1_*.deb \
        ../gir1.2-webkit2-4.1_*.deb >/dev/null
  cd /project
  echo "[build] 运行时依赖安装开始: $(date '+%F %T')"
  bash ./build.bash
  echo "[build] 运行时依赖安装结束: $(date '+%F %T')"
sources:
  - kind: git
    url: https://github.com/deepin-community/webkit2gtk.git
    commit: dcbot/debian/2.50.4
    version: dcbot/debian/2.50.4
    name: webkit2gtk

  # runtime 需要哪些包写在 runtime-packages.list 里：由 buildext.apt 装进构建容器，
  # build.bash 再从容器 /usr 下把它们的文件拷进 /runtime（base 里已有的包自动跳过），
  # 所以这里不再需要几百条 kind: file 的 deb 源。
  # 清单的来源（重新生成/核对清单时参考这一行，不需要再展开成 file 源）：
  # linglong:gen_deb_source install libgtk-4-1, libgtk-4-common, libwebkit2gtk-4.1-0, libwebkit2gtk-4.1-dev, libjavascriptcoregtk-4.1-0, libjavascriptcoregtk-4.1-dev, libadwaita-1-0, libgtk-4-media-gstreamer, libavif16, libgtk-3-0, libgtk-3-bin, libgtk-3-common, libgtk-4-dev, libadwaita-1-dev, libavif-dev, libgtk-3-dev
  # 其中 libwebkit2gtk-4.1-* / libjavascriptcoregtk-4.1-* / gir1.2-*-4.1 / webkit2gtk-driver
  # 由本仓库编译产生，在 runtime-packages.list 里用 @ 开头标出。
